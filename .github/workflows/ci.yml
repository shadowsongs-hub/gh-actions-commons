name: CI

# Guards the shared pi reviewer's shell (model fallback, security posture, model
# attribution) and the cost-gate decision logic. The tests extract the real steps out
# of `pi-pr-review.yml` and run them against a stub `pi` + the real extractor + stubbed
# GitHub APIs, so this needs NO self-hosted runner and NO provider auth — it runs on a
# hosted runner. The reusable `pi-pr-review.yml` is `on: workflow_call`, so it never
# runs here directly; this is the only workflow that executes on push/PR.
#
# Every unit with a `tests/` directory is collected by the glob below, so a new
# unit needs no CI edit. `action-smoke` runs each composite action through its
# real `action.yml` against fixtures, which unit tests of the script cannot cover.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  reviewer-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show node (post + gate steps are github-script JS)
        run: node --version

      - name: Install test deps
        run: python -m pip install --quiet pytest pyyaml

      - name: Run unit tests
        run: python -m pytest --import-mode=importlib -q */tests

  action-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@v4

      - name: release-please-lint passes on a good setup
        uses: ./release-please-lint
        with:
          working-directory: release-please-lint/tests/fixtures/good
          check-tags: "false"
          ignore-tag-patterns: |
            manual@v*

      - name: release-please-lint fails on a bad tag trigger
        id: rpl-bad
        continue-on-error: true
        uses: ./release-please-lint
        with:
          working-directory: release-please-lint/tests/fixtures/bad
          check-tags: "false"

      - name: Assert the bad setup failed
        env:
          OUTCOME: ${{ steps.rpl-bad.outcome }}
        run: test "$OUTCOME" = failure

      - name: junit-go-dark-guard passes on a mixed report
        id: gdg-ok
        uses: ./junit-go-dark-guard
        with:
          report: junit-go-dark-guard/tests/fixtures/mixed.xml

      - name: junit-go-dark-guard fails when every test skipped
        id: gdg-bad
        continue-on-error: true
        uses: ./junit-go-dark-guard
        with:
          report: junit-go-dark-guard/tests/fixtures/all-skipped.xml

      - name: Assert the guard outcomes and outputs
        env:
          TESTS: ${{ steps.gdg-ok.outputs.tests }}
          SKIPPED: ${{ steps.gdg-ok.outputs.skipped }}
          OUTCOME: ${{ steps.gdg-bad.outcome }}
        run: test "$TESTS" = 3 && test "$SKIPPED" = 1 && test "$OUTCOME" = failure

      - name: Push a fixture image to the local registry
        run: |
          docker pull --quiet busybox:1.36
          docker tag busybox:1.36 localhost:5000/smoke:1.0.0
          docker push --quiet localhost:5000/smoke:1.0.0

      - name: registry-tag-exists finds a pushed tag
        id: rte-hit
        uses: ./registry-tag-exists
        with:
          image: localhost:5000/smoke
          tag: 1.0.0
          insecure: "true"

      - name: registry-tag-exists misses an unpushed tag
        id: rte-miss
        uses: ./registry-tag-exists
        with:
          image: localhost:5000/smoke
          tag: 2.0.0
          insecure: "true"

      - name: registry-tag-exists fails when the registry is down
        id: rte-down
        continue-on-error: true
        uses: ./registry-tag-exists
        with:
          image: localhost:5999/smoke
          tag: 1.0.0
          insecure: "true"

      - name: Assert the registry outcomes
        env:
          HIT: ${{ steps.rte-hit.outputs.exists }}
          MISS: ${{ steps.rte-miss.outputs.exists }}
          DOWN: ${{ steps.rte-down.outcome }}
        run: test "$HIT" = true && test "$MISS" = false && test "$DOWN" = failure

      - name: Build SOPS fixture repos
        env:
          K1: age1nueqd25fd8wlyfnlm0nwm0qm0l6xjpx7ekhz6cxpjf93c4jwmswq8g8sla
          K2: age1cdvs3wxkg22l9r7s3h53g2map476xq9t8t8auyhsp7yrm643yszqx54eac
        run: |
          set -euo pipefail
          for kind in good bad; do
            dir="$RUNNER_TEMP/sops-$kind"
            mkdir -p "$dir/secrets"
            git -C "$dir" init -q
            printf 'creation_rules:\n  - path_regex: ^secrets/\n    age: %s,%s\n' "$K1" "$K2" > "$dir/.sops.yaml"
            cp sops-guard/tests/fixtures/app.enc.yaml sops-guard/tests/fixtures/app.env.encrypted "$dir/secrets/"
          done
          echo "A=secret" > "$RUNNER_TEMP/sops-bad/.env"
          git -C "$RUNNER_TEMP/sops-good" add -A
          git -C "$RUNNER_TEMP/sops-bad" add -A -f

      - name: sops-guard passes on real SOPS files
        uses: ./sops-guard
        with:
          working-directory: ${{ runner.temp }}/sops-good

      - name: sops-guard fails on a committed .env
        id: sg-bad
        continue-on-error: true
        uses: ./sops-guard
        with:
          working-directory: ${{ runner.temp }}/sops-bad

      - name: Assert the sops-guard outcome
        env:
          OUTCOME: ${{ steps.sg-bad.outcome }}
        run: test "$OUTCOME" = failure
