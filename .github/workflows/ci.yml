name: CI

# Guards the shared pi reviewer's shell (model fallback, security posture, model
# attribution) and the cost-gate decision logic. The tests extract the real steps out
# of `pi-pr-review.yml` and run them against a stub `pi` + the real extractor + stubbed
# GitHub APIs, so this needs NO self-hosted runner and NO provider auth — it runs on a
# hosted runner. The reusable `pi-pr-review.yml` is `on: workflow_call`, so it never
# runs here directly; this is the only workflow that executes on push/PR.
#
# Every unit with a `tests/` directory is collected by the glob below, so a new
# unit needs no CI edit. `action-smoke` runs each composite action through its
# real `action.yml` against fixtures, which unit tests of the script cannot cover.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  reviewer-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show node (post + gate steps are github-script JS)
        run: node --version

      - name: Install test deps
        run: python -m pip install --quiet pytest pyyaml

      - name: Run unit tests
        run: python -m pytest --import-mode=importlib -q */tests

  action-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: release-please-lint passes on a good setup
        uses: ./release-please-lint
        with:
          working-directory: release-please-lint/tests/fixtures/good
          check-tags: "false"
          ignore-tag-patterns: |
            manual@v*

      - name: release-please-lint fails on a bad tag trigger
        id: rpl-bad
        continue-on-error: true
        uses: ./release-please-lint
        with:
          working-directory: release-please-lint/tests/fixtures/bad
          check-tags: "false"

      - name: Assert the bad setup failed
        env:
          OUTCOME: ${{ steps.rpl-bad.outcome }}
        run: test "$OUTCOME" = failure

      - name: junit-go-dark-guard passes on a mixed report
        id: gdg-ok
        uses: ./junit-go-dark-guard
        with:
          report: junit-go-dark-guard/tests/fixtures/mixed.xml

      - name: junit-go-dark-guard fails when every test skipped
        id: gdg-bad
        continue-on-error: true
        uses: ./junit-go-dark-guard
        with:
          report: junit-go-dark-guard/tests/fixtures/all-skipped.xml

      - name: Assert the guard outcomes and outputs
        env:
          TESTS: ${{ steps.gdg-ok.outputs.tests }}
          SKIPPED: ${{ steps.gdg-ok.outputs.skipped }}
          OUTCOME: ${{ steps.gdg-bad.outcome }}
        run: test "$TESTS" = 3 && test "$SKIPPED" = 1 && test "$OUTCOME" = failure
