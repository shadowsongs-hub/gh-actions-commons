name: sops guard
description: >-
  Fail when a secret is committed in plain text, a SOPS file is not fully
  encrypted, or its age recipients differ from the matching .sops.yaml rule.

inputs:
  working-directory:
    description: Repo root to check. Other paths are relative to it.
    default: "."
  sops-config:
    description: Path to the SOPS config.
    default: .sops.yaml
  encrypted-files:
    description: >-
      Newline-separated patterns for files that must be SOPS-encrypted. A
      pattern without `/` matches the file name. Empty means the defaults:
      `*.encrypted` and `*.enc.*` / `*.sops.*` with a yaml, yml, json or env
      extension.
    default: ""
  forbidden-files:
    description: >-
      Newline-separated patterns for plain-text secret files that must never
      be committed. Empty means `.env`.
    default: ""

runs:
  using: composite
  steps:
    - name: Check SOPS files
      shell: bash
      env:
        SG_ROOT: ${{ inputs.working-directory }}
        SG_CONFIG: ${{ inputs.sops-config }}
        SG_ENCRYPTED: ${{ inputs.encrypted-files }}
        SG_FORBIDDEN: ${{ inputs.forbidden-files }}
      run: |
        set -euo pipefail
        py=python3
        if ! "$py" -c 'import yaml' 2>/dev/null; then
          # PyYAML is the only dependency. Install it into a private venv so
          # the runner's Python is left alone.
          "$py" -m venv "$RUNNER_TEMP/sops-guard-venv"
          py="$RUNNER_TEMP/sops-guard-venv/bin/python"
          "$py" -m pip install --quiet --disable-pip-version-check 'pyyaml==6.0.2'
        fi
        args=(--root "$SG_ROOT" --sops-config "$SG_CONFIG")
        while IFS= read -r p; do [ -n "$p" ] && args+=(--encrypted "$p"); done <<< "$SG_ENCRYPTED"
        while IFS= read -r p; do [ -n "$p" ] && args+=(--forbidden "$p"); done <<< "$SG_FORBIDDEN"
        "$py" "$GITHUB_ACTION_PATH/sops_guard.py" "${args[@]}"
